<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#5E6E5E">
  <title>Слушатель</title>
  <link rel="manifest" href="/manifest.json">
  
  <!-- Подключение премиальных шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Экран авторизации -->
    <section id="auth-screen" class="screen active">
      <div class="auth-container">
        <h1 class="app-title">Слушатель</h1>
        <p class="subtitle">Пространство, где тебя услышат</p>
        
        <form id="login-form">
          <input type="text" id="login-nick" placeholder="Никнейм" required autocomplete="username">
          <input type="password" id="login-pass" placeholder="Пароль" required autocomplete="current-password">
          <button type="submit" class="btn-primary">Войти</button>
        </form>
        
        <p class="toggle-auth">Нет аккаунта? <span id="show-register" tabindex="0" role="button">Создать</span></p>
        
        <form id="register-form" class="hidden">
          <input type="text" id="reg-nick" placeholder="Никнейм (3-20 символов)" required maxlength="20" autocomplete="username">
          <input type="number" id="reg-age" placeholder="Возраст (11-19)" min="11" max="19" required>
          <select id="reg-gender" required>
            <option value="" disabled selected>Выберите пол</option>
            <option value="Мужской">Мужской</option>
            <option value="Женский">Женский</option>
            <option value="Не указывать">Не указывать</option>
          </select>
          <input type="password" id="reg-pass" placeholder="Пароль" required autocomplete="new-password">
          
          <div id="avatar-selector">
            <h3>Выберите аватар</h3>
            <div class="avatar-options">
              <button type="button" class="avatar-opt btn-secondary" data-type="emoji">Эмодзи</button>
              <button type="button" class="avatar-opt btn-secondary" data-type="letter">Буква</button>
              <button type="button" class="avatar-opt btn-secondary" data-type="auto">Случайный</button>
            </div>
            <div id="avatar-customizer" class="hidden">
              <select id="avatar-bg"></select>
              <input type="text" id="avatar-content" placeholder="Эмодзи или буква" maxlength="2">
            </div>
            <div id="avatar-preview" class="avatar-preview"></div>
          </div>

          <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>
      </div>
    </section>

    <!-- Главный экран -->
    <section id="main-screen" class="screen hidden">
      <header class="main-header">
        <div class="header-left">
          <span class="app-title-small">Слушатель</span>
        </div>
        <div class="header-right">
          <button id="theme-toggle" class="btn-icon" aria-label="Переключить тему">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div id="user-avatar-header" class="avatar-small"></div>
          <span id="user-nick-header" class="user-nick">Ник</span>
          <button id="logout-btn" class="btn-text">Выйти</button>
        </div>
      </header>

      <div id="dashboard">
        <div id="listener-status" class="card hidden">
          <h2>Ты: Слушатель</h2>
          <p>Ожидаем того, кому ты нужен.</p>
          <button id="stop-listening" class="btn-secondary">Пауза</button>
        </div>

        <div id="storyteller-panel" class="card">
          <h2>Мне нужно выговориться</h2>
          <div class="filters">
            <select id="pref-gender">
              <option value="Любой">Любой пол</option>
              <option value="Мужской">Мужской</option>
              <option value="Женский">Женский</option>
            </select>
            <div class="age-range">
              <label>Возраст: <span id="age-val">11-15</span></label>
              <input type="range" id="min-age" min="11" max="19" value="11">
              <input type="range" id="max-age" min="11" max="19" value="15">
            </div>
          </div>
          <button id="find-listener" class="btn-primary">Найти слушателя</button>
        </div>

        <div class="card">
          <h2>Стать слушателем</h2>
          <p>Пройди мини-курс и тест, чтобы помогать другим.</p>
          <button id="start-course" class="btn-secondary">Начать обучение</button>
        </div>

        <button id="open-profile" class="btn-text center-btn">Настройки профиля</button>
      </div>
    </section>

    <!-- Экран курса -->
    <section id="course-screen" class="screen hidden">
      <div id="course-content" class="card course-slide">
        <!-- Динамически заполняется JS -->
      </div>
    </section>

    <!-- Экран теста -->
    <section id="test-screen" class="screen hidden">
      <div id="test-content" class="card">
        <!-- Динамически заполняется JS -->
      </div>
    </section>

    <!-- Экран чата/звонка -->
    <section id="chat-screen" class="screen hidden">
      <header class="chat-header">
        <button id="end-session-btn" class="btn-danger btn-sm">Завершить</button>
        <span id="chat-partner" class="chat-partner-name">Собеседник</span>
        <button id="report-btn" class="btn-icon" title="Пожаловаться" aria-label="Пожаловаться">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
      </header>
      
      <div id="chat-messages" class="chat-area"></div>
      
      <div id="chat-input-area">
        <button id="sos-btn" class="btn-sos hidden">SOS</button>
        <input type="text" id="message-input" placeholder="Напиши сообщение..." autocomplete="off">
        <button id="send-msg" class="btn-primary btn-icon-send" aria-label="Отправить">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      
      <div id="audio-controls" class="hidden">
        <button id="toggle-mic" class="btn-secondary">Микрофон: Вкл</button>
        <audio id="remote-audio" autoplay></audio>
      </div>
    </section>

    <!-- Экран профиля -->
    <section id="profile-screen" class="screen hidden">
      <header class="profile-header">
        <button id="back-to-main" class="btn-text">← Назад</button>
        <h2>Профиль</h2>
      </header>
      <div class="card">
        <div id="profile-avatar" class="avatar-large"></div>
        <form id="profile-form">
          <input type="text" id="prof-nick" placeholder="Никнейм" required>
          <input type="number" id="prof-age" placeholder="Возраст" min="11" max="19" required>
          <select id="prof-gender" required>
            <option value="Мужской">Мужской</option>
            <option value="Женский">Женский</option>
            <option value="Не указывать">Не указывать</option>
          </select>
          <button type="submit" class="btn-primary">Сохранить</button>
        </form>
        <hr class="divider">
        <button id="donate-btn" class="btn-primary">Поддержать проект</button>
      </div>
    </section>

    <!-- Модальные окна -->
    <div id="modal-overlay" class="hidden">
      <div id="modal-content" class="card modal-card">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <div id="modal-actions"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
